<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Tech | Yrityksen tiedot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050606;
      --surface: #101212;
      --surface-2: #171b1b;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e5dd;
      --muted: #a4aaa4;
      --ember: #ff4f1f;
      --ember-hot: #ffc65d;
      --shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(255, 79, 31, 0.15), transparent 20%), var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(900px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 6, 6, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 1rem;
    }

    .brand {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .brand::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(255, 79, 31, 0.9);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 1rem 1.4rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--ember-hot);
    }

    main {
      padding: 4rem 0 5rem;
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      color: var(--ember-hot);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.3rem, 6vw, 4rem);
      margin: 0 0 2rem;
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      box-shadow: var(--shadow);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }

    .info-label {
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 1.08rem;
      color: var(--text);
      line-height: 1.5;
    }

    .info-value a {
      color: var(--ember-hot);
      text-decoration: none;
    }

    @media (min-width: 680px) {
      .info-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .nav {
        flex-direction: column;
        justify-content: center;
        padding: 1rem 0;
      }

      .nav-links {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="../" class="brand">TH Tech</a>
      <nav class="nav-links" aria-label="Päävalikko">
        <a href="../">Etusivu</a>
        <a href="../ohjelmia/">Ohjelmat</a>
        <a href="./">Yritys</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="eyebrow">Yrityksen tiedot</p>
    <h1>TH Tech</h1>

    <div class="info-card">
      <div class="info-grid">
        <div class="info-group">
          <span class="info-label">Toiminimi</span>
          <span class="info-value">TH Tech</span>
        </div>

        <div class="info-group">
          <span class="info-label">Y-tunnus</span>
          <span class="info-value">3649025-9</span>
        </div>

        <div class="info-group">
          <span class="info-label">Yritysmuoto</span>
          <span class="info-value">Yksityinen elinkeinonharjoittaja</span>
        </div>

        <div class="info-group">
          <span class="info-label">Toimiala</span>
          <span class="info-value">62100 Ohjelmistojen suunnittelu ja valmistus</span>
        </div>

        <div class="info-group">
          <span class="info-label">Sähköposti</span>
          <span class="info-value"><a href="mailto:thtech74@gmail.com">thtech74@gmail.com</a></span>
        </div>

        <div class="info-group">
          <span class="info-label">Osoite</span>
          <span class="info-value">90570 Oulu<br>Suomi</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
