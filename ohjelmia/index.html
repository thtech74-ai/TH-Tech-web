<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Tech | Ohjelmat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050606;
      --surface: #101212;
      --surface-2: #171b1b;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e5dd;
      --muted: #a4aaa4;
      --ember: #ff4f1f;
      --ember-hot: #ffc65d;
      --shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(255, 79, 31, 0.15), transparent 25%), var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 6, 6, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 1rem;
    }

    .brand {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .brand::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(255, 79, 31, 0.9);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 1rem 1.4rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--ember-hot);
    }

    .page {
      padding: 4rem 0 5rem;
    }

    main.container.page {
      max-width: 900px;
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      color: var(--ember-hot);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.3rem, 6vw, 4rem);
      margin: 0 0 1.5rem;
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 0 0 2rem;
      color: var(--muted);
      max-width: 620px;
      font-size: 1.05rem;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
      max-width: 860px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .info-label {
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 1.04rem;
      color: var(--text);
      line-height: 1.6;
    }

    .info-value a {
      color: var(--ember-hot);
      text-decoration: none;
    }

    @media (max-width: 680px) {
      .nav {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0.9rem 0 1rem;
      }

      .brand {
        width: 100%;
        justify-content: center;
        font-size: 0.82rem;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
        gap: 0.5rem;
      }

      .nav-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.45rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        font-size: 0.68rem;
      }

      .app-info {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="../" class="brand">TH Tech</a>
      <nav class="nav-links" aria-label="Päävalikko">
        <a href="../">Etusivu</a>
        <a href="./">Ohjelmat</a>
        <a href="../yritys/">Yritys</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <p class="eyebrow">Kehitystyöt ja sovellukset</p>
    <h1>Ohjelmat</h1>

    <div class="info-card">
      <div class="info-grid">
        <div class="info-group">
          <span class="info-label">Sovellus</span>
          <span class="info-value">Ember Keys</span>
        </div>

        <div class="info-group">
          <span class="info-label">Kuvaus</span>
          <span class="info-value">Interaktiivinen pianotyökalu, joka toimii nopeasti ja selkeästi myös mobiililaitteilla.</span>
        </div>

        <div class="info-group">
          <span class="info-label">Toiminto</span>
          <span class="info-value"><a href="ember-keys/">Avaa ohjelma →</a></span>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
