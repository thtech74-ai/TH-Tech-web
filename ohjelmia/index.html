<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Tech | Ohjelmat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050606;
      --surface: #101212;
      --surface-2: #171b1b;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e5dd;
      --muted: #a4aaa4;
      --ember: #ff4f1f;
      --ember-hot: #ffc65d;
      --shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(255, 79, 31, 0.15), transparent 25%), var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 6, 6, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 1rem;
    }

    .brand {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .brand::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(255, 79, 31, 0.9);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 1rem 1.4rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--ember-hot);
    }

    .page {
      padding: 4rem 0 5rem;
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      color: var(--ember-hot);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.3rem, 6vw, 4rem);
      margin: 0 0 1.5rem;
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 0 0 2rem;
      color: var(--muted);
      max-width: 620px;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
    }

    .app-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 79, 31, 0.45);
    }

    .app-preview {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(255, 79, 31, 0.15), #080909 65%);
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .app-preview-icon {
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ember-hot);
      border: 1px solid rgba(255, 198, 93, 0.28);
      background: rgba(0, 0, 0, 0.45);
      padding: 9px 14px;
      border-radius: 999px;
    }

    .app-info {
      padding: 1.3rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .app-title {
      margin: 0;
      font-size: 1.2rem;
    }

    .app-action {
      color: var(--ember-hot);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .site-footer {
      padding: 2.5rem 0 3rem;
      border-top: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.2);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .footer-inner strong {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 1.05rem;
    }

    .footer-inner span,
    .footer-links a {
      color: var(--muted);
      text-decoration: none;
    }

    @media (max-width: 680px) {
      .nav {
        flex-direction: column;
        justify-content: center;
        padding: 1rem 0;
      }

      .nav-links {
        justify-content: center;
      }

      .app-info {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="../" class="brand">TH Tech</a>
      <nav class="nav-links" aria-label="Päävalikko">
        <a href="../">Etusivu</a>
        <a href="./">Ohjelmat</a>
        <a href="../yritys/">Yritys</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <p class="eyebrow">Kehitystyöt ja sovellukset</p>
    <h1>Ohjelmat</h1>
    <p class="intro">Käytettävä, interaktiivinen ja mobiiliystävällinen työkalujen kokoelma, joka on rakennettu selkeyden ja nopeuden vuoksi.</p>

    <div class="grid">
      <a href="ember-keys/" class="app-card">
        <div class="app-preview">
          <div class="app-preview-icon">Avaa soitin</div>
        </div>
        <div class="app-info">
          <h3 class="app-title">Ember Keys</h3>
          <span class="app-action">Käynnistä →</span>
        </div>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>TH Tech</strong>
        <span>Y-tunnus: 3649025-9</span>
      </div>
      <div class="footer-links">
        <a href="mailto:thtech74@gmail.com">thtech74@gmail.com</a>
      </div>
    </div>
  </footer>
</body>
</html>
