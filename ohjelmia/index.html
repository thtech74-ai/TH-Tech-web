<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Tech | Ohjelmat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050606;
      --surface: #101212;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e5dd;
      --muted: #7d817e;
      --ember: #ff4f1f;
      --ember-hot: #ffc65d;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
    }

    /* Yläpalkki */
    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px clamp(20px, 5vw, 80px);
      background: rgba(5, 6, 6, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand::before {
      content: '';
      display: block;
      width: 12px;
      height: 12px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--ember);
    }

    nav { display: flex; gap: 30px; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }
    nav a:hover { color: var(--ember-hot); }

    /* Pääsisältö */
    main {
      padding: 80px clamp(20px, 5vw, 80px);
      max-width: 1400px;
      margin: 0 auto;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      color: var(--ember-hot);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      margin: 0 0 50px 0;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    /* Sovelluskortit (vain nimi ja kuva-alue) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 100px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--ember);
      box-shadow: 0 10px 30px rgba(255, 79, 31, 0.1);
    }

    .app-preview {
      height: 180px;
      background: radial-gradient(circle at 50% 50%, rgba(255, 79, 31, 0.15), #080909 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    /* Pieni pianon koskettimisto-symboli tai efekti esikatseluun */
    .app-preview-icon {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--ember-hot);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 198, 93, 0.3);
      padding: 8px 16px;
      border-radius: 4px;
      background: rgba(0,0,0,0.5);
    }

    .app-info {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .app-action {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--ember-hot);
    }

    /* Alapalkki */
    footer {
      border-top: 1px solid var(--line);
      padding: 60px clamp(20px, 5vw, 80px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-info strong {
      color: var(--text);
      font-size: 1rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .footer-links a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: var(--ember); }

    @media (max-width: 600px) {
      nav { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../" class="brand">TH TECH</a>
    <nav>
      <a href="./">ohjelmat</a>
      <a href="../yritys/">Yritys</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Kehitystyöt ja sovellukset</div>
    <h1>ohjelmat</h1>
    
    <div class="grid">
      <!-- Ember Keys -kortti pelkällä kuvalla ja nimellä -->
      <a href="ember-keys/" class="app-card">
        <div class="app-preview">
          <div class="app-preview-icon">▶ AVAA SOITIN</div>
        </div>
        <div class="app-info">
          <h3 class="app-title">Ember Keys</h3>
          <span class="app-action">Käynnistä →</span>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <div class="footer-info">
      <strong>TH Tech</strong>
      <span>Y-tunnus: 3649025-9</span>
      <span>Oulu, Suomi</span>
    </div>
    <div class="footer-links">
      <a href="mailto:thtech74@gmail.com">thtech74@gmail.com</a>
    </div>
  </footer>

</body>
</html>
