<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Tech | Ohjelmistokehitys</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050606;
      --surface: #101212;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e5dd;
      --muted: #7d817e;
      --ember: #ff4f1f;
      --ember-hot: #ffc65d;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
    }

    /* Yläpalkki */
    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px clamp(20px, 5vw, 80px);
      background: rgba(5, 6, 6, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand::before {
      content: '';
      display: block;
      width: 12px;
      height: 12px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--ember);
    }

    nav { display: flex; gap: 30px; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }
    nav a:hover { color: var(--ember-hot); }

    /* Pääsisältö */
    main {
      padding: 0 clamp(20px, 5vw, 80px);
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero {
      padding: 140px 0 100px;
      max-width: 800px;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      color: var(--ember-hot);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      line-height: 1.1;
      margin: 0 0 30px 0;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--muted);
      max-width: 600px;
    }

    /* Alapalkki */
    footer {
      border-top: 1px solid var(--line);
      padding: 60px clamp(20px, 5vw, 80px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-info strong {
      color: var(--text);
      font-size: 1rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .footer-links a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: var(--ember); }

    @media (max-width: 600px) {
      nav { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <a href="./" class="brand">TH TECH</a>
   <nav>
  <a href="/TH-Tech-web/Ohjelmia/">Ohjelmia</a>
  <a href="/TH-Tech-web/Tietoja/">Yritys</a>
</nav>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Digitaalisia ratkaisuja</div>
      <h1>Ohjelmistojen suunnittelu ja valmistus.</h1>
      <p>Modernien, suorituskykyisten ja interaktiivisten verkkosovellusten kehitystä.</p>
    </section>
  </main>

  <footer>
    <div class="footer-info">
      <strong>TH Tech</strong>
      <span>Y-tunnus: 3649025-9</span>
      <span>Oulu, Suomi</span>
    </div>
    <div class="footer-links">
      <a href="mailto:thtech74@gmail.com">thtech74@gmail.com</a>
    </div>
  </footer>

</body>
</html>
