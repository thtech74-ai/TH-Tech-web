<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Tech | Ohjelmistokehitys</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050606;
      --surface: #101212;
      --surface-2: #171b1b;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e5dd;
      --muted: #a4aaa4;
      --ember: #ff4f1f;
      --ember-hot: #ffc65d;
      --shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    html, body {
      min-height: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(255, 79, 31, 0.15), transparent 25%), var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 6, 6, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 1rem;
    }

    .brand {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .brand::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(255, 79, 31, 0.9);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 1rem 1.4rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--ember-hot);
    }

    main {
      flex: 1;
      overflow: hidden;
    }

    .hero {
      padding: 5.5rem 0 4rem;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2.5rem;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      color: var(--ember-hot);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      margin: 0 0 1rem;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 5rem);
      max-width: 700px;
    }

    h2 {
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .lead {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.18rem;
    }

    .cta-row {
      margin-top: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.primary {
      background: var(--ember);
      color: #fff;
      box-shadow: 0 12px 30px rgba(255, 79, 31, 0.35);
    }

    .button.secondary {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
    }

    .hero-copy {
      max-width: 760px;
    }

    .section {
      padding: 1.5rem 0 4rem;
    }

    .simple-box {
      max-width: 760px;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .simple-box p {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
    }

    .site-footer {
      margin-top: auto;
      padding: 2.5rem 0 3rem;
      border-top: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.2);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .footer-inner h3 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      text-align: right;
      color: var(--muted);
    }

    .contact-list a {
      color: var(--text);
      text-decoration: none;
    }

    @media (max-width: 760px) {
      .hero-inner,
      .split,
      .card-grid {
        grid-template-columns: 1fr;
      }

      .nav {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0.9rem 0 1rem;
      }

      .brand {
        width: 100%;
        justify-content: center;
        font-size: 0.82rem;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
        gap: 0.5rem;
      }

      .nav-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.45rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        font-size: 0.68rem;
      }

      .cta-row {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .contact-list {
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="./" class="brand">TH Tech</a>
      <nav class="nav-links" aria-label="Päävalikko">
        <a href="./">Etusivu</a>
        <a href="./ohjelmia/">Ohjelmat</a>
        <a href="./yritys/">Yritys</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">Digitaalisia ratkaisuja</p>
          <h1>TH Tech</h1>
          <p class="lead">Selkeitä ja käytännöllisiä verkkoratkaisuja yrityksille ja yrittäjille.</p>
          <div class="cta-row">
            <a class="button primary" href="./ohjelmia/">Ohjelmat</a>
            <a class="button secondary" href="./yritys/">Yritys</a>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="simple-box">
          <p>Sivusto on parhaillaan rikki, mutta yritämme parhaamme mukaan piilottaa sen.</p>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
